# .github/workflows/mirror-to-shared.yml
name: Mirror to shared
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push --mirror to shared
        env:
          TOKEN: ${{ secrets.SHARED_PUSH_TOKEN }}
        run: |
          set -e
          git config --global user.name "mirror-bot"
          git config --global user.email "mirror@example.com"
          # nuke any existing remote that doesn't have the token baked in
          git remote rm shared || true
          # include the SHARED USERNAME so creds are cached separately from yours
          git remote add shared https://VDT-UTiSchool:${TOKEN}@github.com/VDT-UTiSchool/vdt_cb.git
          # (optional) quick sanity: print remotes with token redacted
          git remote -v | sed -e 's/https:\/\/[^@]*@/https:\/\/***@/'
          git push --mirror shared --quiet
